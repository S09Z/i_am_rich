name: Flutter CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode with verbose output'
        required: false
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.10.3'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Print environment info
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        run: |
          echo "=== Debug Mode Enabled ==="
          echo "Runner OS: ${{ runner.os }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          pwd
          ls -la

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Debug - Flutter doctor
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        run: flutter doctor -v

      - name: Install dependencies
        run: |
          flutter pub get
          if [ "${{ github.event.inputs.debug_enabled }}" == "true" ]; then
            echo "=== Installed Packages ==="
            flutter pub deps
          fi

      - name: Verify formatting
        run: flutter format --set-exit-if-changed .
        continue-on-error: ${{ github.event.inputs.debug_enabled == 'true' }}

      - name: Analyze code
        run: flutter analyze
        continue-on-error: ${{ github.event.inputs.debug_enabled == 'true' }}

      - name: Run tests
        run: flutter test
        continue-on-error: ${{ github.event.inputs.debug_enabled == 'true' }}

      - name: Check for outdated dependencies
        run: flutter pub outdated
        continue-on-error: true

      - name: Debug - Upload Flutter logs on failure
        if: ${{ failure() && github.event.inputs.debug_enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-logs-analyze
          path: |
            **/*.log
            .dart_tool/
          retention-days: 2

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Debug - Check Android setup
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        run: |
          echo "=== Android Build Environment ==="
          flutter doctor -v
          ls -la android/

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.debug_enabled }}" == "true" ]; then
            flutter build apk --release --verbose
          else
            flutter build apk --release
          fi

      - name: Debug - List build outputs
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        run: |
          echo "=== Build Outputs ==="
          ls -lah build/app/outputs/flutter-apk/ || echo "Build directory not found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-ios:
    name: Build iOS (macOS)
    runs-on: macos-latest
    needs: analyze-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Debug - Check iOS setup
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        run: |
          echo "=== iOS Build Environment ==="
          flutter doctor -v
          ls -la ios/

      - name: Build iOS (no codesign)
        run: |
          if [ "${{ github.event.inputs.debug_enabled }}" == "true" ]; then
            flutter build ios --release --no-codesign --verbose
          else
            flutter build ios --release --no-codesign
          fi

      - name: Debug - List iOS build outputs
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        run: |
          echo "=== iOS Build Outputs ==="
          ls -lah build/ios/iphoneos/ || echo "iOS build directory not found"

      - name: Archive iOS build
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r app-release.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/app-release.ipa
          retention-days: 7
